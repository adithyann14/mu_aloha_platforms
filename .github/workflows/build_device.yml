name: Build UEFI for a given device

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      build_type:
        required: false
        type: string
        default: DEBUG
      screen_debug:
        description: Show serial/debug output on the screen
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      target:
        description: Device folder name
        required: true
        type: string
        default: xiaomi-pipa
      build_type:
        description: Build type
        required: true
        type: choice
        options:
          - DEBUG
          - RELEASE
        default: DEBUG
      screen_debug:
        description: Screen debug (show debug output on the display)
        required: true
        type: boolean
        default: true

env:
  WM_CI_BUILD: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Enable screen debug output (KonaPkg)
        if: inputs.screen_debug
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -path '*/KonaPkg/Kona*.dsc' -not -path './Build/*')
          [ "${#files[@]}" -gt 0 ] || { echo "::error::KonaPkg/Kona*.dsc not found"; exit 1; }
          sed -i -E 's/^([[:space:]]*USE_SCREEN_FOR_SERIAL_OUTPUT[[:space:]]*=[[:space:]]*)0/\11/' "${files[@]}"
          grep -nE '^[[:space:]]*USE_SCREEN_FOR_SERIAL_OUTPUT[[:space:]]*=[[:space:]]*1' "${files[@]}" \
            || { echo "::error::could not set USE_SCREEN_FOR_SERIAL_OUTPUT=1"; exit 1; }

      - name: Build SecureBoot and No SecureBoot UEFI for ${{ inputs.target }} (${{ inputs.build_type }}, screen debug ${{ inputs.screen_debug }})
        run: bash scripts/ci_setup.sh && ./build_uefi.py -d ${{ inputs.target }} -t ${{ inputs.build_type }}

      - name: Upload ${{ inputs.target }}'s Artifact
        uses: actions/upload-artifact@v6
        with:
          name: uefi-images-${{ inputs.target }}-${{ inputs.build_type }}${{ inputs.screen_debug && '-screen' || '' }}
          path: Build/*/ci_artifacts
          compression-level: 9
